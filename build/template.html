<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- template.html must be self-sufficient: the Claude Artifact platform injects its
     own charset/viewport meta into its wrapper, but GitHub Pages serves this file raw
     with no wrapper at all. Without these, mobile browsers fall back to a ~980px
     virtual viewport, the @media (max-width:860px) rules never match, and the whole
     page renders as the desktop two-column layout shrunk to fit -- unusable on a
     phone in either orientation. Confirmed via a real GitHub Pages test 2026-09-18. -->
<title>The Hill Yard Sale Map</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=DM+Mono:wght@400;500&display=swap">
<!-- home-screen / installed-app support -- assets are build/pwa/*, copied to
     dist/ by inject.py and mirrored to the repo root by build.sh -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Yard Sale Map">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FAF7F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#181310" media="(prefers-color-scheme: dark)">
<style>
:root{
  color-scheme:light dark;
  --brick:#A63328; --brick-deep:#7E241C; --basil:#2E6B41; --gold:#B8811F; --you:#1F62A8; --on-accent:#FFFFFF;
  --ink:#241A17; --ink-2:#4A3B35; --mute:#6C5D55;
  --paper:#FAF7F4; --surface:#FFFFFF; --sunk:#F1EBE6;
  --line:#E4DBD4; --line-soft:#EFE8E3;
  --map-bg:#F0EAE4; --map-block:#E7DFD8; --map-road:#FFFFFF;
  --map-road-edge:#D8CDC4; --map-park:#D5E2D2; --map-rail:#C9BDB4;
  --shadow:0 1px 2px rgba(36,26,23,.06), 0 6px 18px -8px rgba(36,26,23,.18);
  --shadow-pop:0 2px 6px rgba(36,26,23,.10), 0 18px 40px -12px rgba(36,26,23,.32);
  /* --on-accent is the text colour for anything sitting ON a --brick/--gold/
     --basil/--you fill. It is white on the light palette and near-black on the
     dark one, where those accents become light pastels: white on dark-mode
     brick measured 3.35:1, which fails WCAG AA for 13px text and this map gets
     read one-handed in September sunlight. */
  --display:"Archivo Black","Arial Black",system-ui,sans-serif;
  --body:"Public Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
/* the browser's own form-control/scrollbar theme should track our theme, not
   just the OS preference — otherwise an explicit data-theme override leaves
   native widgets rendered in the wrong scheme underneath our own palette */
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --brick:#E0674F; --brick-deep:#F08E75; --basil:#79B98C; --gold:#DCA83F; --you:#7FB6EA; --on-accent:#1C1310;
    --ink:#F4EDE8; --ink-2:#D6C8C0; --mute:#A3928A;
    --paper:#181310; --surface:#221B17; --sunk:#2A211C;
    --line:#3A2F29; --line-soft:#2E2520;
    --map-bg:#1C1613; --map-block:#251E19; --map-road:#4A3E37;
    --map-road-edge:#2A221D; --map-park:#24352A; --map-rail:#3A302A;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
    --shadow-pop:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --brick:#E0674F; --brick-deep:#F08E75; --basil:#79B98C; --gold:#DCA83F; --you:#7FB6EA; --on-accent:#1C1310;
  --ink:#F4EDE8; --ink-2:#D6C8C0; --mute:#A3928A;
  --paper:#181310; --surface:#221B17; --sunk:#2A211C;
  --line:#3A2F29; --line-soft:#2E2520;
  --map-bg:#1C1613; --map-block:#251E19; --map-road:#4A3E37;
  --map-road-edge:#2A221D; --map-park:#24352A; --map-rail:#3A302A;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -8px rgba(0,0,0,.6);
  --shadow-pop:0 2px 6px rgba(0,0,0,.5), 0 18px 40px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
#app{display:flex; flex-direction:column; height:100%; min-height:0}

/* ---------- masthead ---------- */
header#top{
  flex:none; background:var(--surface);
  border-bottom:1px solid var(--line);
  padding:14px 16px 12px; padding-block-start:calc(14px + env(safe-area-inset-top,0px));
}
.mast{display:flex; align-items:stretch; gap:14px;
      max-width:1500px; margin:0 auto; width:100%}
.tri{flex:none; width:7px; align-self:stretch; min-height:42px; border-radius:4px;
     background:linear-gradient(var(--basil) 0 33.3%, #F2EDE8 33.3% 66.6%, var(--brick) 66.6% 100%);
     box-shadow:inset 0 0 0 1px rgba(36,26,23,.10)}
.mast h1{
  font-family:var(--display); font-size:clamp(19px,4.4vw,27px); line-height:1.05;
  margin:0 0 4px; letter-spacing:-.017em; text-transform:uppercase; text-wrap:balance;
}
.mast h1 em{font-style:normal; color:var(--brick)}
/* date/time replaces the old sales-count/location line -- that's already
   shown in the controls-bar tally and the footnote, so it was duplicate
   information spent on header height the map could use instead */
.sub{margin:0; display:flex; align-items:center; gap:9px}
.sub .cal{font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--mute); font-weight:500}
.sub .hrs{font-family:var(--mono); font-size:12px; letter-spacing:.06em;
  text-transform:uppercase; color:var(--ink-2); font-weight:600}
.live{font-family:var(--mono); font-size:11px; letter-spacing:.06em;
  text-transform:uppercase; border-radius:5px; padding:3px 6px; font-weight:500}
.live.on{background:var(--basil); color:var(--on-accent)}
.live.done{background:var(--line); color:var(--mute)}

/* ---------- controls ---------- */
#controls{
  flex:none; background:var(--surface); border-bottom:1px solid var(--line);
  padding:10px 16px 11px;
}
.cwrap{max-width:1500px; margin:0 auto; display:flex; flex-direction:column; gap:9px}
.crow{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.search{position:relative; flex:1 1 230px; min-width:0; max-width:340px}
.search svg{position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:15px; height:15px; color:var(--mute); pointer-events:none}
.search input{
  width:100%; font-family:var(--body); font-size:14px; color:var(--ink);
  background:var(--sunk); border:1px solid var(--line); border-radius:9px;
  padding:9px 30px 9px 31px; -webkit-appearance:none;
}
.search input::placeholder{color:var(--mute)}
.search input:focus-visible{outline:2px solid var(--brick); outline-offset:1px; background:var(--surface)}
.search .clr{position:absolute; right:5px; top:50%; transform:translateY(-50%);
  border:0; background:none; color:var(--mute); cursor:pointer; font-size:17px;
  line-height:1; padding:4px 6px; border-radius:6px}
.search .clr:hover{color:var(--brick-deep); background:var(--line-soft)}

.chips{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
button.chip{
  font-family:var(--body); font-size:12.5px; font-weight:500; color:var(--ink-2);
  background:var(--surface); border:1px solid var(--line); border-radius:99px;
  padding:6px 11px; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  transition:background .12s, border-color .12s, color .12s;
}
button.chip:hover{border-color:var(--ink-2); color:var(--ink)}
button.chip .k{font-family:var(--mono); font-size:11px; color:var(--mute);
  font-weight:500; font-variant-numeric:tabular-nums}
button.chip[aria-pressed="true"]{background:var(--brick); border-color:var(--brick); color:var(--on-accent)}
button.chip[aria-pressed="true"] .k{color:var(--on-accent); opacity:.8}
button.chip.pay[aria-pressed="true"]{background:var(--basil); border-color:var(--basil)}
button.chip.cashy[aria-pressed="true"]{background:var(--gold); border-color:var(--gold); color:var(--on-accent)}
button.chip.cashy[aria-pressed="true"] .k{color:var(--on-accent); opacity:.82}
button.chip:focus-visible{outline:2px solid var(--brick); outline-offset:2px}
.sep{width:1px; align-self:stretch; background:var(--line); margin:0 2px}
.reset{font-family:var(--body); font-size:12.5px; color:var(--brick); background:none;
  border:0; cursor:pointer; padding:6px 4px; text-decoration:underline;
  text-underline-offset:2px; font-weight:600}
.reset[hidden]{display:none!important}
.tally{font-family:var(--mono); font-size:11.5px; color:var(--mute); margin-left:auto;
  font-variant-numeric:tabular-nums; white-space:nowrap}
.tally b{color:var(--brick); font-weight:500}

/* ---------- split ---------- */
#split{flex:1 1 auto; display:flex; min-height:0; max-width:1500px; width:100%;
  margin:0 auto; padding:12px 16px 16px; gap:14px}
#mapcol{flex:1 1 58%; min-width:0; display:flex; flex-direction:column; min-height:0}
#listcol{flex:1 1 42%; max-width:470px; min-width:0; display:flex; flex-direction:column; min-height:0}

#mapshell{
  position:relative; flex:1 1 auto; min-height:0; border-radius:12px; overflow:hidden;
  background:var(--map-bg); border:1px solid var(--line); box-shadow:var(--shadow);
  touch-action:none; cursor:grab;
}
#mapshell.drag{cursor:grabbing}
#mapsvg{position:absolute; inset:0; width:100%; height:100%; display:block}
#pinlayer{position:absolute; inset:0; transform-origin:0 0; pointer-events:none}

button.pin{
  position:absolute; top:0; left:0; pointer-events:auto;
  transform-origin:50% 100%; border:0; padding:0; background:none; cursor:pointer;
  width:30px; height:38px; margin:-38px 0 0 -15px;
  transition:opacity .16s;
}
button.pin .bd{
  width:30px; height:30px; border-radius:50% 50% 50% 50%/48% 48% 52% 52%;
  background:var(--brick); border:2px solid var(--surface);
  display:grid; place-items:center; position:relative;
  /* a plain box-shadow, not filter:drop-shadow -- a filter forces the browser
     to rasterize this element's subtree (including the number below) at its
     own pre-zoom size, so the map's ancestor scale then blows up an already-
     blurry bitmap instead of re-rendering crisp glyphs. Confirmed as the
     cause of "numbers unreadable when zoomed in", 2026-09-18. */
  box-shadow:0 2px 3px rgba(36,26,23,.34);
}
button.pin .bd::after{
  content:""; position:absolute; bottom:-6px; left:50%; width:9px; height:9px;
  background:var(--brick); border-right:2px solid var(--surface);
  border-bottom:2px solid var(--surface);
  transform:translateX(-50%) rotate(45deg); border-radius:0 0 3px 0; z-index:-1;
}
button.pin .n{font-family:var(--mono); font-weight:500; font-size:13.5px; color:var(--on-accent);
  font-variant-numeric:tabular-nums; letter-spacing:-.03em}
button.pin.multi .bd{box-shadow:0 2px 3px rgba(36,26,23,.34), 0 0 0 2px var(--gold)}
button.pin.dim{opacity:.17}
button.pin.dim .bd{background:var(--mute)}
/* where the bold leg is taking you */
button.pin.dest{z-index:39}
button.pin.dest .bd{box-shadow:0 2px 3px rgba(36,26,23,.34), 0 0 0 3px var(--surface), 0 0 0 5.5px var(--brick)}
button.pin.on{z-index:40}
button.pin.on .bd{background:var(--brick-deep); transform:scale(1.32);
  box-shadow:0 2px 3px rgba(36,26,23,.34), 0 0 0 3px var(--gold), 0 0 0 6px rgba(184,129,31,.28)}
button.pin.on .bd::after{background:var(--brick-deep)}
button.pin:focus-visible{outline:none}
button.pin:focus-visible .bd{box-shadow:0 2px 3px rgba(36,26,23,.34), 0 0 0 3px var(--ink), 0 0 0 6px rgba(255,255,255,.7)}
button.pin.clustered{display:none}

/* several sales too close together to tap individually collapse into one
   badge; gold already means "more than one" via .multi, so reuse it here */
button.clusterbtn{
  position:absolute; top:0; left:0; pointer-events:auto;
  transform-origin:50% 50%; border:0; padding:0; background:none; cursor:pointer;
  width:36px; height:36px; margin:-18px 0 0 -18px;
}
button.clusterbtn[hidden]{display:none}
button.clusterbtn .cbd{
  width:36px; height:36px; border-radius:50%; background:var(--gold);
  border:2.5px solid var(--surface); display:grid; place-items:center;
  box-shadow:0 2px 4px rgba(36,26,23,.36), 0 0 0 3px rgba(184,129,31,.24);
}
button.clusterbtn .cn{font-family:var(--mono); font-weight:600; font-size:14px; color:var(--on-accent);
  font-variant-numeric:tabular-nums; letter-spacing:-.03em}
button.clusterbtn:hover .cbd{transform:scale(1.08)}
button.clusterbtn:focus-visible{outline:none}
button.clusterbtn:focus-visible .cbd{box-shadow:0 2px 4px rgba(36,26,23,.36), 0 0 0 3px var(--ink), 0 0 0 6px rgba(255,255,255,.7)}

/* small chevrons along the walking loop so its direction of travel still
   reads where the dashed line crosses itself in the dense blocks */
.rtA{position:absolute; top:0; left:0; width:11px; height:11px; margin:-5.5px 0 0 -5.5px;
  pointer-events:none; opacity:.6}
.rtA svg{display:block; width:100%; height:100%}
/* explicit, not relying on the UA sheet: this page is also served raw by
   GitHub Pages with no host wrapper supplying a [hidden] rule */
.rtA[hidden]{display:none}

.mapui{position:absolute; display:flex; gap:6px; z-index:50}
.mapui.tr{top:9px; right:9px; flex-direction:column}
.mapui.bl{bottom:9px; left:9px; align-items:center}
button.mbtn{
  width:32px; height:32px; border-radius:8px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink); cursor:pointer; font-size:16px;
  display:grid; place-items:center; box-shadow:var(--shadow); font-family:var(--body);
  line-height:1; padding:0;
}
button.mbtn:hover{background:var(--sunk); border-color:var(--ink-2)}
button.mbtn:focus-visible{outline:2px solid var(--brick); outline-offset:2px}
button.mbtn[aria-pressed="true"]{background:var(--brick); border-color:var(--brick); color:var(--on-accent)}
button.mbtn.wide{width:auto; padding:0 11px; font-size:11.5px; font-weight:600;
  letter-spacing:.02em; gap:5px; text-transform:uppercase; font-family:var(--mono)}
.scalebar{
  background:color-mix(in srgb, var(--surface) 88%, transparent); border:1px solid var(--line);
  border-radius:7px; padding:4px 8px; font-family:var(--mono); font-size:11px;
  color:var(--ink-2); box-shadow:var(--shadow); display:flex; align-items:center; gap:7px;
  font-variant-numeric:tabular-nums;
}
.scalebar i{display:block; height:4px; border:1px solid var(--ink-2);
  border-top:0; background:none}

/* ---------- landmarks ---------- */
.lm{
  position:absolute; top:0; left:0; width:20px; height:20px; margin:-10px 0 0 -10px;
  transform-origin:10px 10px; pointer-events:none; z-index:20;
}
.lm .dot{
  position:absolute; inset:0; border-radius:6px;
  background:var(--basil); color:var(--on-accent); display:grid; place-items:center;
  border:2px solid var(--surface); box-shadow:0 1px 3px rgba(36,26,23,.32);
}
.lm .dot svg{width:12px; height:12px}
.lm .lbl{
  position:absolute; left:25px; top:50%; transform:translateY(-50%);
  font-family:var(--mono); font-size:9.5px; font-weight:500; text-transform:uppercase;
  letter-spacing:.05em; color:var(--basil); background:var(--surface);
  border-radius:4px; padding:2px 5px; box-shadow:0 1px 2px rgba(36,26,23,.16);
  white-space:nowrap;
}
.lm.flip .lbl{left:auto; right:25px}

/* ---------- you are here ----------
   --you, not --basil: green already means "landmark" on this map and brick
   means "sale", so the reader's own position needs its own colour or it reads
   as a fourth orientation marker. */
button.mbtn.locb[aria-pressed="true"]{background:var(--you); border-color:var(--you); color:var(--on-accent)}
button.mbtn.locb[data-state="wait"]{opacity:.6}
#me{
  position:absolute; top:0; left:0; width:18px; height:18px; margin:-9px 0 0 -9px;
  transform-origin:9px 9px; pointer-events:none; z-index:40;
}
#me[hidden]{display:none!important}
#me .acc{
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  border-radius:50%; background:color-mix(in srgb, var(--you) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--you) 40%, transparent);
}
#me .me-dot{
  position:absolute; inset:0; border-radius:50%; background:var(--you);
  border:2.5px solid #fff; box-shadow:0 1px 4px rgba(36,26,23,.42);
}
/* The nearest stop, so the reader can find where they are in the list without
   the list itself reordering away from the walking loop. Distinct from .on
   (the selected stop) on purpose — both can be true at once. */
button.clusterbtn.near .cbd{box-shadow:0 2px 4px rgba(36,26,23,.36), 0 0 0 2.5px var(--surface), 0 0 0 5px var(--you)}
button.pin.near .bd{box-shadow:0 2px 3px rgba(36,26,23,.34), 0 0 0 2.5px var(--surface), 0 0 0 5px var(--you)}
article.card.near{border-color:var(--you);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--you) 17%, transparent), var(--shadow)}
article.card.near .cnum{background:var(--you); color:var(--on-accent)}
/* Top-left, stopping short of the zoom column. Bottom-centre put it straight
   through the scale bar on a phone, and the map's own controls own the right
   edge at every width. */
#locmsg{
  position:absolute; left:9px; right:50px; top:9px; z-index:55;
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  box-shadow:var(--shadow); padding:6px 10px; font-size:12px; color:var(--ink-2);
}
#locmsg[hidden]{display:none!important}

/* ---------- expand the map ----------
   A phone-only control: desktop already gives the map its own column. One tap
   swaps to a full-screen map; the selected sale keeps its card, pinned to the
   bottom edge over the map, so tapping a pin still tells you something. */
#expbtn{display:none}
#expbtn .exp-in{display:none}
#app.mapfull #expbtn .exp-out{display:none}
#app.mapfull #expbtn .exp-in{display:block}

/* ---------- the selected sale ----------
   This used to be a popup floating over the map. On a phone the card covered
   most of the map it was describing -- the thing the reader needed to look at.
   It lives at the top of the list column now: on desktop the map column is left
   completely alone, and on a phone it sits directly under the sticky map. */
#nowpanel{
  flex:none; background:var(--surface); border:1px solid var(--brick);
  box-shadow:0 0 0 2px color-mix(in srgb, var(--brick) 15%, transparent), var(--shadow);
  border-radius:11px; padding:10px 11px 11px; margin:0 2px 9px;
}
#nowpanel[hidden]{display:none!important}
.nowhd{display:grid; grid-template-columns:auto 1fr auto auto; gap:8px; align-items:center}
.nownum{font-family:var(--mono); font-size:12px; font-weight:500; color:var(--on-accent);
  background:var(--brick); border-radius:6px; padding:3px 8px;
  font-variant-numeric:tabular-nums}
.nowad{font-family:var(--display); font-size:14px; text-transform:uppercase;
  letter-spacing:-.01em; line-height:1.2; min-width:0}
.nowvn{font-size:11.5px; color:var(--basil); font-weight:600; margin-top:2px}
.nowwalk{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--you);
  margin-top:2px; font-variant-numeric:tabular-nums}
.nowit{margin:8px 0 0; font-size:12.5px; color:var(--ink-2); line-height:1.45;
  max-height:112px; overflow-y:auto}
.nowit + .nowit{border-top:1px dashed var(--line); padding-top:7px}
.nowpay{margin-top:6px; display:inline-block}
button.nowx{border:0; background:none; cursor:pointer; color:var(--mute);
  font-size:17px; line-height:1; padding:3px 5px; border-radius:6px}
button.nowx:hover{color:var(--brick); background:var(--line-soft)}

/* ---------- next stop ---------- */
/* The popup's primary action. Brick, full width, and the biggest thing in the
   card, because "where do I go next" is the question a reader standing on the
   sidewalk is actually asking. */
button.nextbtn{
  margin-top:10px; width:100%; cursor:pointer; text-align:left;
  background:var(--brick); border:0; border-radius:9px; padding:8px 10px;
  display:grid; grid-template-columns:auto 1fr auto; gap:3px 8px; align-items:center;
}
button.nextbtn:hover{background:var(--brick-deep)}
button.nextbtn:focus-visible{outline:2px solid var(--ink); outline-offset:2px}
.nextbtn .nlab{grid-column:1/-1; font-family:var(--mono); font-size:9.5px; font-weight:500;
  letter-spacing:.09em; text-transform:uppercase; color:var(--on-accent); opacity:.78}
.nextbtn .nnum{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--brick);
  background:var(--surface); border-radius:5px; padding:1px 6px; font-variant-numeric:tabular-nums}
.nextbtn .nad{font-family:var(--mono); font-size:13px; font-weight:500; color:var(--on-accent);
  letter-spacing:-.015em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.nextbtn .ndist{font-family:var(--mono); font-size:11px; color:var(--on-accent); opacity:.85;
  font-variant-numeric:tabular-nums; white-space:nowrap}

/* ---------- list mode switch ---------- */
.modes{display:flex; gap:0; background:var(--sunk); border:1px solid var(--line);
  border-radius:8px; padding:2px; flex:none}
button.mode{
  font-family:var(--mono); font-size:10.5px; font-weight:500; letter-spacing:.04em;

/* distance from the reader, shown on each card in closest-first mode */
.cdist{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--you);
  font-variant-numeric:tabular-nums; margin-top:3px}

/* ---------- popup ---------- */
#pop{
  position:absolute; z-index:60; width:min(290px, calc(100% - 22px));
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  box-shadow:var(--shadow-pop); padding:12px 13px 13px; font-size:13px;
}
#pop[hidden]{display:none!important}
#pop .x{position:absolute; top:5px; right:6px; border:0; background:none; cursor:pointer;
  color:var(--mute); font-size:17px; line-height:1; padding:4px 6px; border-radius:6px}
#pop .x:hover{color:var(--brick); background:var(--line-soft)}
#pop .hd{display:flex; gap:9px; align-items:baseline; padding-right:20px}
#pop .num{font-family:var(--mono); font-size:11px; font-weight:500; color:var(--on-accent);
  background:var(--brick); border-radius:5px; padding:2px 6px; flex:none}
#pop .ad{font-family:var(--display); font-size:14.5px; text-transform:uppercase;

#pop .vn{color:var(--basil); font-size:12px; font-weight:600; margin-top:3px}
#pop .it{margin:9px 0 0; color:var(--ink-2); font-size:12.5px; line-height:1.45;
  max-height:132px; overflow-y:auto}
#pop .it + .it{border-top:1px dashed var(--line); padding-top:8px}

/* houses too close together to ever separate by zooming (real next-door
   neighbors) get a pick list instead of a dead-end cluster badge */
#pop .picklist{margin-top:9px; max-height:260px; overflow-y:auto;
  display:flex; flex-direction:column; gap:5px}
button.pick{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  font-family:var(--body); font-size:13px; color:var(--ink); cursor:pointer;
  background:var(--sunk); border:1px solid transparent; border-radius:8px;
  padding:7px 9px;
}
button.pick:hover{border-color:var(--brick)}
button.pick:focus-visible{outline:2px solid var(--brick); outline-offset:1px}
button.pick .pnum{font-family:var(--mono); font-weight:500; font-size:11.5px; color:var(--brick);
  background:var(--surface); border-radius:6px; padding:2px 7px; flex:none;
  font-variant-numeric:tabular-nums}
button.pick .pad{font-family:var(--mono); font-weight:500; font-size:12.5px; letter-spacing:-.01em}

/* ---------- list ---------- */
.lhead{flex:none; display:flex; flex-direction:column; gap:5px; padding:0 2px 8px}
.lhead-row{display:flex; align-items:baseline; gap:8px}
.lhead h2{font-family:var(--display); font-size:11.5px; text-transform:uppercase;
  letter-spacing:.075em; margin:0; color:var(--mute)}
.hint{margin:0; font-size:11.5px; color:var(--mute); line-height:1.4; min-width:0}
.hint[hidden]{display:none!important}
.hint.warn{color:var(--brick); font-weight:600}
#list{flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column; gap:7px; padding:1px 2px 2px}
.stgroup{font-family:var(--display); font-size:11px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--brick); padding:9px 2px 1px;
  display:flex; align-items:center; gap:8px}
.stgroup::after{content:""; height:1px; flex:1; background:var(--line)}
.stgroup:first-child{padding-top:0}

article.card{
  background:var(--surface); border:1px solid var(--line); border-radius:10px;
  padding:10px 11px; cursor:pointer; display:grid;
  grid-template-columns:28px 1fr auto; gap:10px; align-items:start;
  transition:border-color .12s, box-shadow .12s, background .12s; text-align:left;
}
article.card:hover{border-color:var(--ink-2); box-shadow:var(--shadow)}
article.card.on{border-color:var(--brick); box-shadow:0 0 0 2px rgba(166,51,40,.17), var(--shadow);
  background:color-mix(in srgb, var(--brick) 4%, var(--surface))}
article.card:focus-visible{outline:2px solid var(--brick); outline-offset:1px}
.cnum{font-family:var(--mono); font-weight:500; font-size:12px; color:var(--brick);
  background:var(--sunk); border-radius:7px; height:26px; display:grid;
  place-items:center; font-variant-numeric:tabular-nums}
article.card.on .cnum{background:var(--brick); color:var(--on-accent)}
.cad{font-family:var(--mono); font-size:13.5px; font-weight:500; letter-spacing:-.015em;
  line-height:1.25; color:var(--ink)}
.cvn{font-size:11.5px; color:var(--basil); font-weight:600; margin-top:1px}
.cit{font-size:12.5px; color:var(--ink-2); line-height:1.42; margin-top:5px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden}
article.card.on .cit{-webkit-line-clamp:unset; display:block}
.ctags{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px}
/* The category tags were regex-derived from the item text sitting right above
   them, so every card restated its own description in worse words. Only the
   payment chip survives on a card -- that is information the description does
   not carry. The tags still drive the filter chips. */
.tg{font-size:11px; font-weight:600; letter-spacing:.015em; color:var(--ink-2);
  background:var(--sunk); border-radius:5px; padding:2px 6px; white-space:nowrap}
.tg.hit{background:color-mix(in srgb, var(--brick) 15%, var(--sunk)); color:var(--brick)}
.tg.cash{background:color-mix(in srgb, var(--basil) 13%, var(--sunk)); color:var(--basil)}
.approx{font-size:10.5px; color:var(--gold); font-weight:600; margin-top:5px;
  display:flex; gap:4px; align-items:center}
/* Directions is an icon now, and the glyph is an arrow leaving a box rather
   than a plain chevron: it hands off to Google Maps, and nothing about a bare
   "Directions" label said the reader was about to leave the page. The bold leg
   on the map is the in-page answer; this is for getting there from elsewhere. */
.golink{display:grid; place-items:center; width:28px; height:28px; flex:none;
  color:var(--mute); text-decoration:none; border:1px solid var(--line);
  border-radius:7px; background:var(--surface)}

.golink:focus-visible{outline:2px solid var(--brick); outline-offset:1px}

footer#foot{flex:none; padding:0 16px; max-width:1500px; margin:0 auto; width:100%;

footer#foot a{color:var(--mute)}

/* ---------- phone ---------- */
@media (max-width:860px){
  /* one swipeable row of filters instead of five stacked ones, so the map
     stays near the top of a phone screen */
  .crow.scrollrow{
    flex-wrap:nowrap; overflow-x:auto; overflow-y:hidden;
    margin:0 -16px; padding:2px 16px 4px;
    scrollbar-width:none; -webkit-overflow-scrolling:touch;
    /* a soft fade at the right edge hints there are more chips to scroll to,
       instead of letting the row cut a chip off mid-word with no warning */
    -webkit-mask-image:linear-gradient(to right, var(--ink) calc(100% - 28px), transparent 100%);
    mask-image:linear-gradient(to right, var(--ink) calc(100% - 28px), transparent 100%);
  }
  .crow.scrollrow::-webkit-scrollbar{display:none}
  .crow.scrollrow > *{flex:none}
  .crow.scrollrow .chips{flex-wrap:nowrap}
  .crow.scrollrow .sep{align-self:center; height:22px}
  /* a phone scrolls the page instead of nesting a short scroller inside a
     locked screen; the map sticks to the top so it stays in view while the
     list runs past it */
  html, body{height:auto}
  #app{height:auto; min-height:100%}
  #split{flex-direction:column; padding:10px 16px 12px; gap:10px}
  /* Mobile is the only version anyone will actually use, so the map gets the
     room. It grew from 52vh once the sale card stopped floating over it -- the
     card is in the list column now and costs the map nothing. */
  #mapcol{
    /* dvh, not vh: on iOS Safari vh resolves against the tall viewport (toolbar
       hidden), so a vh-sized map renders shorter than asked for whenever the
       toolbar is showing -- which is most of the time. dvh tracks what is
       actually visible. vh first as the fallback for browsers without dvh. */
    flex:none; height:68vh; height:68dvh; min-height:280px;
    position:sticky; top:env(safe-area-inset-top, 0px); z-index:5;
    background:var(--paper); padding-bottom:9px;
  }
  #listcol{flex:0 0 auto; max-width:none; min-height:0}
  #list{overflow:visible; min-height:0}
  .tally{margin-left:0}
  .lhead-row{flex-wrap:wrap; gap:4px}

  #expbtn{display:grid}
  /* Full-screen map. Everything else is hidden rather than repositioned, so the
     page simply has nothing to scroll -- no fixed positioning, no second scroll
     container, none of the sticky-offset coupling that the normal phone layout
     needs. The safe-area insets move to the map controls so they clear the notch
     and the home indicator. */
  #app.mapfull > header#top,
  #app.mapfull > #controls,
  #app.mapfull > footer#foot{display:none}
  #app.mapfull #split{padding:0; gap:0}
  #app.mapfull #mapcol{height:100vh; height:100dvh; padding-bottom:0; top:0}
  #app.mapfull #mapshell{border-radius:0; border:0}
  #app.mapfull .mapui.tr{top:calc(9px + env(safe-area-inset-top, 0px))}
  #app.mapfull .mapui.bl{bottom:calc(9px + env(safe-area-inset-bottom, 0px))}
  #app.mapfull #locmsg{top:calc(9px + env(safe-area-inset-top, 0px))}
  /* the sale card rides the bottom edge, over the map */
  #app.mapfull #listcol{
    position:fixed; left:0; right:0; bottom:0; z-index:110; max-width:none;
    padding:0 10px calc(10px + env(safe-area-inset-bottom, 0px));
  }
  #app.mapfull .lhead, #app.mapfull #list{display:none}
  #app.mapfull #nowpanel{position:static; margin:0}

  /* The selected-sale panel sticks directly under the sticky map, so the sale
     and its "next stop" stay on screen while the reader scrolls the list.
     The offset has to track #mapcol's height above it -- keep the two in step. */
  #nowpanel{position:sticky; z-index:4; margin-bottom:10px;
    top:calc(68vh + env(safe-area-inset-top, 0px));
    top:calc(68dvh + env(safe-area-inset-top, 0px))}
  /* the panel competes with the map for a short phone screen -- let the item
     text scroll sooner so the address and the next-stop step always fit */
  #nowpanel .nowit{max-height:74px}
}
@media (max-width:520px){
  .mast h1{font-size:20px}
  .search{max-width:none; flex-basis:100%}
  #mapcol{height:64vh; height:64dvh}
  #nowpanel{top:calc(64vh + env(safe-area-inset-top, 0px));   /* tracks #mapcol */
            top:calc(64dvh + env(safe-area-inset-top, 0px))}
}
#rotate{display:none}
/* Exactly the broken combination: narrow enough to get the phone layout, but
   with no height to give it. Not gated on pointer:coarse -- that is untestable
   in a desktop browser and would silently never fire if a device disagreed. A
   desktop window both under 860px wide and under 500px tall is vanishingly rare,
   and resizing it clears this. */
@media (orientation:landscape) and (max-height:500px) and (max-width:860px){
  #app{display:none}
  #rotate{
    display:grid; position:fixed; inset:0; z-index:200; place-content:center;
    justify-items:center; gap:10px; text-align:center; padding:24px;
    background:var(--paper); color:var(--ink-2);
  }
  #rotate svg{color:var(--brick)}
  #rotate b{font-family:var(--display); font-size:15px; text-transform:uppercase;
    letter-spacing:.02em; color:var(--ink)}
  #rotate span{font-size:13px; max-width:34ch; line-height:1.45}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}

@media print{
  /* paper is always light, regardless of the viewer's on-screen theme — without
     this, printing from a dark-mode browser session resolves --ink/--mute to
     their light, near-white dark-mode values against the forced white page */
  :root{
    color-scheme:light;
    --brick:#A63328; --brick-deep:#7E241C; --basil:#2E6B41; --gold:#B8811F; --you:#1F62A8; --on-accent:#FFFFFF;
    --ink:#241A17; --ink-2:#4A3B35; --mute:#6C5D55;
    --paper:#FAF7F4; --surface:#FFFFFF; --sunk:#F1EBE6;
    --line:#E4DBD4; --line-soft:#EFE8E3;
    --map-bg:#F0EAE4; --map-block:#E7DFD8; --map-road:#FFFFFF;
    --map-road-edge:#D8CDC4; --map-park:#D5E2D2; --map-rail:#C9BDB4;
  }
  #controls,.mapui,#pop,.golink{display:none!important}
  #app{height:auto} #split{flex-direction:column; padding:0}
  #mapcol{height:8.5cm} #listcol{max-width:none}
  #list{overflow:visible; display:block}
  article.card{break-inside:avoid; page-break-inside:avoid; margin-bottom:5px; box-shadow:none}
  .cit{-webkit-line-clamp:unset; display:block}
  body{background:#fff}
}

<script id="geomdata" type="application/json">__GEOM__</script>
<script id="stopdata" type="application/json">__STOPS__</script>
<script id="routemeta" type="application/json">__META__</script>
<script id="walkdata" type="application/json">__WALK__</script>
<script id="graphdata" type="application/json">__GRAPH__</script>
<script>
(function(){
"use strict";
var GEOM  = JSON.parse(document.getElementById('geomdata').textContent);
var STOPS = JSON.parse(document.getElementById('stopdata').textContent);
var META  = JSON.parse(document.getElementById('routemeta').textContent);
/* WALK[i] is the path a walker actually takes from stop i to stop i+1, routed
   along real streets at build time by walk.py. The last leg closes the loop. */
var WALK  = JSON.parse(document.getElementById('walkdata').textContent);
var GRAPH = JSON.parse(document.getElementById('graphdata').textContent);

/* ---------------- runtime street routing ----------------
   walk.py routes stop-to-stop at build time, which is all the drawn loop needs.
   But the reader wants the walk from where they are actually standing, and that
   isn't known until they open the page -- so the street graph ships and we run
   Dijkstra here.

   graph.json is delta-coded integers at 1e-5 degrees, and deliberately OMITS the
   ~26k street-crossing connectors: they are derivable from the node positions
   alone, so they are rebuilt below rather than shipped (they are four fifths of
   the edges). See CROSS in walk.py for why crossing anywhere matters. */
var GN=[], GADJ=null, GCROSS=22;
(function(){
  var n=GRAPH.n, la=0, lo=0;
  for(var i=0;i<n.length;i+=2){ la+=n[i]; lo+=n[i+1]; GN.push([la/1e5, lo/1e5]); }
})();
function gm(a,b){
  var dy=(GN[a][0]-GN[b][0])*111320, dx=(GN[a][1]-GN[b][1])*111320*kx;
  return Math.sqrt(dy*dy+dx*dx);
}
/* Built on first use, not at load: it costs tens of milliseconds and a reader
   who never turns on location never needs it. */
function graphReady(){
  if(GADJ) return;
  GADJ=[]; for(var i=0;i<GN.length;i++) GADJ.push([]);
  function link(a,b){ var w=gm(a,b); GADJ[a].push(b,w); GADJ[b].push(a,w); }
  var e=GRAPH.e, a=0;
  for(var i=0;i<e.length;i+=2){ a+=e[i]; link(a, a+e[i+1]); }
  /* the crossing connectors, same rule as the build script: join any two nodes
     closer than GCROSS that aren't already joined */
  var cell={}, key;
  for(var i=0;i<GN.length;i++){
    key=(Math.floor(GN[i][0]*111320/GCROSS))+','+(Math.floor(GN[i][1]*111320*kx/GCROSS));
    (cell[key]||(cell[key]=[])).push(i);
  }
  for(key in cell){
    var p=key.split(','), cy=+p[0], cx=+p[1], cand=[];
    for(var dy=-1;dy<=1;dy++) for(var dx=-1;dx<=1;dx++){

function nearestNode(lat, lon){

    var dy=(GN[i][0]-lat)*111320, dx=(GN[i][1]-lon)*111320*kx;
    var d=dy*dy+dx*dx;

  }

}
/* Dijkstra with a binary heap. ~6k nodes, so a few milliseconds. */
function gPath(src, dst){
  graphReady();
  if(src<0 || dst<0) return null;
  if(src===dst) return [src];
  var dist=new Float64Array(GN.length); dist.fill(Infinity);
  var prev=new Int32Array(GN.length); prev.fill(-1);
  var done=new Uint8Array(GN.length);
  var hn=[src], hd=[0]; dist[src]=0;
  function push(node,d){
    hn.push(node); hd.push(d);
    var i=hn.length-1;
    while(i>0){ var p=(i-1)>>1; if(hd[p]<=hd[i]) break;
      var t=hn[p];hn[p]=hn[i];hn[i]=t; t=hd[p];hd[p]=hd[i];hd[i]=t; i=p; }
  }
  function pop(){
    var top=hn[0], td=hd[0], last=hn.length-1;
    hn[0]=hn[last]; hd[0]=hd[last]; hn.pop(); hd.pop();
    var i=0, n=hn.length;
    for(;;){ var l=2*i+1, r=l+1, m=i;
      if(l<n && hd[l]<hd[m]) m=l;
      if(r<n && hd[r]<hd[m]) m=r;
      if(m===i) break;
      var t=hn[m];hn[m]=hn[i];hn[i]=t; t=hd[m];hd[m]=hd[i];hd[i]=t; i=m; }
    return [top,td];
  }
  while(hn.length){
    var it=pop(), u=it[0];
    if(done[u]) continue;
    done[u]=1;
    if(u===dst) break;
    var ad=GADJ[u];
    for(var j=0;j<ad.length;j+=2){
      var v=ad[j], nd=it[1]+ad[j+1];
      if(nd<dist[v]){ dist[v]=nd; prev[v]=u; push(v,nd); }
    }
  }
  if(!done[dst]) return null;
  var out=[dst], u2=dst;
  while(u2!==src){ u2=prev[u2]; out.push(u2); }
  out.reverse();
  return out;
}

var k=1, tx=0, ty=0, MINK=0.55, MAXK=14;
function apply(){
  var m='translate('+tx.toFixed(2)+'px,'+ty.toFixed(2)+'px) scale('+k.toFixed(4)+')';
  if(world) world.setAttribute('transform',
    'translate('+tx.toFixed(2)+','+ty.toFixed(2)+') scale('+k.toFixed(4)+')');
  layer.style.transform=m;
  layer.style.setProperty('--inv', 1/k);
  var pk = Math.min(1, Math.max(0.70, 0.70 + 0.30*(k-1)/1.5));
  var f = (pk/k).toFixed(4);
  pins.forEach(function(p){ p.style.transform='scale('+f+')'; });
  clusterBadges.forEach(function(b){ b.style.transform='scale('+f+')'; });
  if(legArrow) legArrow.style.transform='rotate('+legArrowAng.toFixed(1)+'deg) scale('+f+')';
  var lf=(1/k).toFixed(4);
  if(mePos){ placeMe(); meEl.lastChild.style.transform='scale('+lf+')'; }
  lms.forEach(function(d,i){
    d.style.transform='scale('+lf+')';
    var q=px(LANDMARKS[i].lat, LANDMARKS[i].lon);
    d.classList.toggle('flip', (q[0]*k+tx) > W*0.62);
  });
  updateClusters();
  updLabels(); updScale();
  if(pickerAt) placePopAt(pickerAt[0]*k+tx, pickerAt[1]*k+ty);
}
/* labels: keep text a constant screen size by scaling font instead of the group,
   and hide the rare label whose anchor point would fall under a fixed map
   control (zoom/landmark/route buttons, the scale bar) — those overlaps were
   confirmed by the design detector, not just landmark-vs-pin proximity */
function updLabels(){
  if(!labelGroup) return;
  var fs=(11/k), sw=(3.8/k);
  for(var i=0;i<labelGroup.childNodes.length;i++){
    var g=labelGroup.childNodes[i], t=g.firstChild;
    var len=+g.getAttribute('data-len'), tier=+g.getAttribute('data-tier');
    var show = (len*k > 62) && (k>1.45 || tier>=2 || len*k>150);
    if(show){
      var mx=+g.getAttribute('data-mx'), my=+g.getAttribute('data-my');
      if(pointInUI(mx*k+tx, my*k+ty)) show=false;
    }
    g.style.display = show ? '' : 'none';
    t.setAttribute('font-size', fs.toFixed(2));
    t.setAttribute('stroke-width', sw.toFixed(2));
    t.setAttribute('y', (-5.2/k).toFixed(2));
    t.setAttribute('letter-spacing', (0.3/k).toFixed(3));
  }
}
/* ---------------- dense-block pin clustering ----------------
   Screen-space distance between two stops is (layer-local distance) * k, so
   membership depends only on zoom, never on pan — recompute is keyed on k and
   on the current selection, not run on every drag frame. */
var lastClusterKey=null;
function updateClusters(){
  var key = k.toFixed(4)+'|'+sel+'|'+nearI+'|'+destStop();
  if(key===lastClusterKey) return;
  lastClusterKey=key;

  /* the selected stop and the stop the reader is being sent to are always shown
     standalone -- a destination hidden inside a cluster badge doesn't answer
     "where am I going" */
  var dst=destStop();
  function solo(i){ return i===sel || i===dst; }
  var n=stopPos.length, adj=[];
  for(var i=0;i<n;i++) adj[i]=[];
  for(var i=0;i<n;i++){
    if(solo(i)) continue;
    for(var j=i+1;j<n;j++){
      if(solo(j)) continue;
      var dx=stopPos[i][0]-stopPos[j][0], dy=stopPos[i][1]-stopPos[j][1];
      if(Math.hypot(dx,dy)*k < CLUSTER_PX){ adj[i].push(j); adj[j].push(i); }
    }
  }
  var seen={}, comps=[];
  for(var i=0;i<n;i++){
    if(seen[i]||solo(i)) continue;
    var stack=[i], comp=[]; seen[i]=1;
    while(stack.length){
      var u=stack.pop(); comp.push(u);
      adj[u].forEach(function(v){ if(!seen[v]){ seen[v]=1; stack.push(v); } });
    }
    comps.push(comp);
  }

  var badgeIdx=0, clustered={};
  comps.forEach(function(comp){
    if(comp.length<2) return;
    comp.forEach(function(i){ clustered[i]=1; });
    var cx=0, cy=0;
    comp.forEach(function(i){ cx+=stopPos[i][0]; cy+=stopPos[i][1]; });
    cx/=comp.length; cy/=comp.length;
    var maxD=0;
    for(var a=0;a<comp.length;a++) for(var b=a+1;b<comp.length;b++){
      var ddx=stopPos[comp[a]][0]-stopPos[comp[b]][0], ddy=stopPos[comp[a]][1]-stopPos[comp[b]][1];
      maxD=Math.max(maxD, Math.hypot(ddx,ddy));
    }
    var idx=badgeIdx++, badge=clusterBadges[idx];
    badge.hidden=false;
    badge.style.left=cx.toFixed(1)+'px'; badge.style.top=cy.toFixed(1)+'px';
    badge.firstChild.firstChild.textContent=comp.length;
    /* the nearest stop may be swallowed by a cluster, and a highlight on a
       display:none pin helps nobody -- mark the badge standing in for it */
    badge.classList.toggle('near', comp.indexOf(nearI)>=0);
    var streets={}; comp.forEach(function(i){ streets[STOPS[i].street]=1; });
    badge.setAttribute('aria-label', comp.length+' sales near '+
      Object.keys(streets).slice(0,2).join(' & ')+', tap to choose one');
    badgeInfo[idx]={cx:cx, cy:cy, maxD:maxD, members:comp.slice()};
  });
  for(var r=badgeIdx; r<clusterBadges.length; r++) clusterBadges[r].hidden=true;
  pins.forEach(function(p,i){ p.classList.toggle('clustered', !!clustered[i]); });
}
var RULERS=[[30.48,'100 ft'],[76.2,'250 ft'],[152.4,'500 ft'],
             [402.34,'0.25 mi'],[804.67,'0.5 mi'],[1609.34,'1 mi']];
function updScale(){
  var mpp = 111320/(base*k);          /* metres per screen pixel */
  var pick = RULERS[0], w = pick[0]/mpp;
  for(var i=0;i<RULERS.length;i++){
    var p = RULERS[i][0]/mpp;
    if(p>=46){ pick=RULERS[i]; w=p; break; }
    pick=RULERS[i]; w=p;
  }
  document.getElementById('scalebar').style.width = Math.max(18, Math.min(150, w)).toFixed(0)+'px';
  document.getElementById('scaletxt').textContent = pick[1];
}
function clamp(){
  k = Math.max(MINK, Math.min(MAXK, k));
  /* keep at least `keep` px of the drawing inside the frame on every edge */
  var keep = Math.min(W, H) * 0.42;
  tx = Math.max(keep - W*k, Math.min(W - keep, tx));
  ty = Math.max(keep - H*k, Math.min(H - keep, ty));
}
function fit(){ k=1; tx=0; ty=0; apply(); }
/* Programmatic camera moves are eased; the reader's own drag and pinch stay
   instant. Tapping a cluster used to snap several zoom levels in one frame,
   which read as the map lurching rather than moving. */
var camAnim=null;
function reducedMotion(){
  try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; }
}
function now(){
  return (window.performance && performance.now) ? performance.now() : Date.now();
}
var camDone=null;
function camStop(){
  if(camAnim){ cancelAnimationFrame(camAnim); camAnim=null; }
  if(camDone){ clearTimeout(camDone); camDone=null; }
}
function animateTo(k1, tx1, ty1, ms){
  camStop();
  function land(){ camStop(); k=k1; tx=tx1; ty=ty1; clamp(); apply(); }
  if(reducedMotion() || !window.requestAnimationFrame){ land(); return; }
  var k0=k, x0=tx, y0=ty, t0=now();
  ms=ms||300;
  /* Guarantee arrival. requestAnimationFrame is not promised to fire -- it is
     starved in a backgrounded tab, and measurably never fires in some embedded
     views. Without this the map would stop wherever the last frame left it and
     simply never reach the stop the reader tapped. Easing is the nicety; landing
     is the contract. */
  camDone=setTimeout(land, ms+150);
  (function step(){
    var t=Math.min(1,(now()-t0)/ms);
    var e=1-Math.pow(1-t,3);                 /* ease-out cubic */
    /* zoom interpolates geometrically -- a linear ramp between two scales
       accelerates visibly at the wide end */
    k=k0*Math.pow(k1/k0, e);
    tx=x0+(tx1-x0)*e; ty=y0+(ty1-y0)*e;
    clamp(); apply();
    if(t<1){ camAnim=requestAnimationFrame(step); }
    else { camStop(); }
  })();
}
/* where zoomAt would land, without going there */
function zoomTarget(cx,cy,f){
  var nk=Math.max(MINK,Math.min(MAXK,k*f));
  f=nk/k;
  return [nk, cx-(cx-tx)*f, cy-(cy-ty)*f];
}
function zoomAt(cx,cy,f){
  var nk=Math.max(MINK,Math.min(MAXK,k*f));
  f=nk/k; if(f===1) return;
  tx = cx - (cx-tx)*f; ty = cy - (cy-ty)*f; k=nk; clamp(); apply();
}
shell.addEventListener('wheel', function(e){
  e.preventDefault();
  camStop();
  var r=shell.getBoundingClientRect();
  zoomAt(e.clientX-r.left, e.clientY-r.top, e.deltaY<0?1.14:1/1.14);
}, {passive:false});

var ptr={}, np=0, lastMid=null, lastDist=0, moved=false;
shell.addEventListener('pointerdown', function(e){
  if(e.target.closest('button.pin')||e.target.closest('button.clusterbtn')||
     e.target.closest('#pop')||e.target.closest('.mapui')) return;
  /* the reader's hand wins over an eased move already in flight */
  camStop();
  shell.setPointerCapture(e.pointerId);
  ptr[e.pointerId]={x:e.clientX,y:e.clientY}; np++; moved=false;
  if(np===1) shell.classList.add('drag');
  if(np===2){ var p=vals(); lastDist=dist(p[0],p[1]); lastMid=mid(p[0],p[1]); }
});
function vals(){ return Object.keys(ptr).map(function(i){return ptr[i];}); }
function dist(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
function mid(a,b){ return {x:(a.x+b.x)/2,y:(a.y+b.y)/2}; }
shell.addEventListener('pointermove', function(e){
  if(!ptr[e.pointerId]) return;
  var prev=ptr[e.pointerId];
  ptr[e.pointerId]={x:e.clientX,y:e.clientY};
  var r=shell.getBoundingClientRect();
  if(np===1){
    var dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    if(Math.abs(dx)+Math.abs(dy)>2) moved=true;
    tx+=dx; ty+=dy; clamp(); apply();
  } else if(np>=2){
    var p=vals(), d=dist(p[0],p[1]), m=mid(p[0],p[1]);
    if(lastDist>0){
      zoomAt(m.x-r.left, m.y-r.top, d/lastDist);
      tx += (m.x-lastMid.x); ty += (m.y-lastMid.y); clamp(); apply();
    }
    lastDist=d; lastMid=m; moved=true;
  }
});
function up(e){
  if(!ptr[e.pointerId]) return;
  delete ptr[e.pointerId]; np=Math.max(0,np-1);
  if(np<2){ lastDist=0; lastMid=null; }
  if(np===0){ shell.classList.remove('drag');
    if(!moved && !e.target.closest('button.pin') && !e.target.closest('button.clusterbtn') &&
       !e.target.closest('#pop')) select(null); }
}
shell.addEventListener('pointerup', up);
shell.addEventListener('pointercancel', up);

document.getElementById('zin').onclick  = function(){ zoomAt(W/2,H/2,1.5); };
document.getElementById('zout').onclick = function(){ zoomAt(W/2,H/2,1/1.5); };
document.getElementById('zfit').onclick = function(){ fit(); select(null); };

/* Expand/collapse the map. A class change doesn't fire a resize event, so the
   projection has to be re-measured by hand -- otherwise the map keeps drawing at
   the old size in the new box. */
var appEl=document.getElementById('app'), expbtn=document.getElementById('expbtn');
expbtn.onclick=function(){
  var on=!appEl.classList.contains('mapfull');
  appEl.classList.toggle('mapfull', on);
  expbtn.setAttribute('aria-pressed', on?'true':'false');
  expbtn.setAttribute('aria-label', on?'Shrink the map':'Expand the map to full screen');
  expbtn.setAttribute('title', on?'Shrink map':'Expand map');
  if(on) window.scrollTo(0,0);   /* the page has nothing to scroll now */
  relayout();
  /* instant: the map box just changed size, same reason as the resize handler */
  if(activeLeg!==null) fitLeg(true); else fit();
};
var rtbtn=document.getElementById('rtbtn');
rtbtn.onclick=function(){
  routeOn=!routeOn;
  rtbtn.setAttribute('aria-pressed', routeOn?'true':'false');
  if(routeGroup) routeGroup.style.display = routeOn ? '' : 'none';
  /* deliberately does NOT hide legGroup: the bold next-stop leg is the point of
     the map now, and burying it behind a toggle is what made the old route line
     invisible to everyone */
};

/* ---------------- you are here ----------------
   navigator.geolocation is a browser API, not a network request, so it doesn't
   touch the CSP or this page's zero-runtime-fetch property. The position is used
   only to draw the dot and to work out the nearest stop; it is never sent
   anywhere, and there is no backend here to send it to. Keep it that way.

   Deliberately NOT auto-panning: recentring would fight a reader who has looked
   ahead up the loop or opened a popup. The dot moves, the map stays put. */
var locbtn=document.getElementById('locbtn'), locmsg=document.getElementById('locmsg');
var locWatch=null, locOn=false, mePos=null, meAccM=0, nearI=null;
var locTimer=null, locNote='';   /* locNote: why location isn't showing, if it isn't */
var renderedAt=null, RENDER_M=12;   /* where the closest-first list was last built */
var centreNext=false;               /* the reader asked to be centred on */
function centreOnMe(){
  if(!mePos) return;
  var q=px(mePos[0],mePos[1]), k1=Math.max(k, 3.2);
  animateTo(k1, W/2-q[0]*k1, H/2-q[1]*k1);
}

function locSay(t){
  locmsg.textContent=t||''; locmsg.hidden=!t;
  /* it joins the map controls as a no-go rect for street labels, and it can
     grow to two lines, so re-measure rather than trusting the resize handler */
  measureUIRects(); updLabels();
}

function metres(aLat,aLon,bLat,bLon){
  var dy=(aLat-bLat)*111320, dx=(aLon-bLon)*111320*kx;
  return Math.sqrt(dy*dy+dx*dx);
}
function nearestStop(){
  var best=null, bd=Infinity;
  STOPS.forEach(function(s,i){
    var d=metres(mePos[0],mePos[1],s.lat,s.lon);
    if(d<bd){ bd=d; best=i; }
  });
  return [best, bd];
}
/* Highlights the nearest stop in both map and list. The list order itself is
   left alone on purpose -- its whole point is the fixed walking loop, and
   sorting it by proximity would quietly dismantle that. */
function syncNear(){
  pins.forEach(function(p,i){ p.classList.toggle('near', i===nearI); });
  cards.forEach(function(c){ if(c) c.classList.toggle('near', +c.dataset.i===nearI); });
  updateClusters();
}
function placeMe(){
  if(!meEl) return;
  if(!mePos){ meEl.hidden=true; return; }
  var q=px(mePos[0],mePos[1]);
  meEl.hidden=false;
  meEl.style.left=q[0].toFixed(1)+'px';
  meEl.style.top =q[1].toFixed(1)+'px';
  /* The accuracy ring is a real-world radius, so it lives in layer units and
     rides the map's zoom transform. The dot is a screen mark, so apply()
     counter-scales it instead. */
  var r=Math.max(0, meAccM)/111320*base;
  var acc=meEl.firstChild;
  acc.style.width=(r*2).toFixed(1)+'px';
  acc.style.height=(r*2).toFixed(1)+'px';
  /* r is in layer units, so the on-screen size is r*k -- hide the ring only
     when it would be smaller than the dot it sits under, at the current zoom */
  acc.style.display = (r*k)>11 ? '' : 'none';
}
function onPos(p){
  locbtn.removeAttribute('data-state');
  var first = !mePos;
  mePos=[p.coords.latitude, p.coords.longitude];
  meAccM=p.coords.accuracy||0;
  placeMe(); apply();
  /* Centre on the reader when their position first arrives, and again whenever
     they ask for it with the location button. Only then: recentring on every fix
     would fight someone who has deliberately panned up the street, which is the
     whole reason this map doesn't follow you around. */
  if(first || centreNext){ centreNext=false; centreOnMe(); }
  if(mePos[0]<V.s || mePos[0]>V.n || mePos[1]<V.w || mePos[1]>V.e){
    nearI=null; syncNear();
    locSay('You’re outside the map area — nothing to show yet.');
    return;
  }
  if(locNote){ locNote=''; syncModeUI(); }
  var n=nearestStop(), prevNear=nearI; nearI=n[0]; syncNear();
  /* A new fix reorders closest-first and restates every card's distance -- but
     only when it is worth it. GPS reports a position roughly every second and
     jitters by metres while standing still; rebuilding 59 cards under a reader
     who is mid-scroll moves the ground under them. Rebuild when they have
     actually walked RENDER_M, or when the nearest sale changes. */
  if(listMode==='near' &&
     (prevNear!==nearI || renderedAt===null ||
      metres(renderedAt[0],renderedAt[1],mePos[0],mePos[1]) > RENDER_M)){
    renderedAt=[mePos[0],mePos[1]];
    syncModeUI(); render();
  }
  /* the bold path starts at the reader, so it has to be rebuilt as they move */
  if(activeLeg!==null && (first || legFromMe===false ||
      metres(legPts[0][0],legPts[0][1],mePos[0],mePos[1]) > RENDER_M)){
    buildLeg(activeLeg); drawLeg();
  }
  /* kept short deliberately: at 375px anything longer wraps to a second line
     and eats the top of the map */
  var d=n[1], ft=Math.round(d*3.28084);
  locSay('Nearest: #'+num(STOPS[nearI])+' '+STOPS[nearI].addr+
         ' · '+(d<300 ? ft+' ft' : (d/1609.344).toFixed(1)+' mi'));
}
function onLocErr(e){
  locFailed(e && e.code===1
    ? 'Location is off for this page. The map still works — you just won’t see your dot.'
    : 'Couldn’t get a location fix. Try again in the open air.');
}
/* One place for "location didn't happen", because the reader may have asked for
   it from the map button OR from the Closest-to-me list button, and only ever
   sees one of those two places. */
function locFailed(msg){
  stopLoc();
  locNote=msg;
  /* The hint sits right next to the button the reader pressed, so it says this.
     locmsg would repeat the same sentence a few pixels below it. */
  locSay('');
  syncModeUI();
}
function stopLoc(){
  clearTimeout(locTimer);
  if(locWatch!==null && navigator.geolocation){
    try{ navigator.geolocation.clearWatch(locWatch); }catch(e){}
  }
  locWatch=null; locOn=false; mePos=null; nearI=null; renderedAt=null;
  /* closest-first can't mean anything now; fall back rather than freezing a
     stale order the reader can no longer trust */
  if(listMode==='near'){ listMode='loop'; syncModeUI(); render(); }
  locbtn.setAttribute('aria-pressed','false');
  locbtn.removeAttribute('data-state');
  placeMe(); syncNear();
}
/* Whether this page is even permitted to ask for a location.
   Measured, 2026-09-18: a Claude Artifact renders inside a cross-origin iframe
   whose allow= list is "translator; language-detector; fullscreen;
   clipboard-write; gamepad" -- no geolocation. Permissions Policy denies
   geolocation to a cross-origin frame unless it is delegated, so location can
   never work in the artifact no matter what the reader taps or permits. It
   works fine on GitHub Pages, which is an ordinary top-level page.
   Without this check the reader just gets a button that does nothing. */
function geoBlocked(){
  try{
    if(document.featurePolicy && document.featurePolicy.allowsFeature)
      return !document.featurePolicy.allowsFeature('geolocation');
  }catch(e){}
  return false;   /* can't tell -- try anyway and let the error path handle it */
}
var EMBEDDED_MSG='Location is blocked in this embedded preview. '+
  'Open the map in its own browser tab and it will work.';

locbtn.onclick=function(){
  /* Tapping this mostly means "show me where I am", so centring is the first
     action. But watchPosition runs high-accuracy GPS for a four-hour event, so
     there has to be a way to stop it: once the map is already centred on the
     reader, a second tap turns location off. */
  if(locOn && mePos){
    var q=px(mePos[0],mePos[1]);
    var centred = Math.abs(q[0]*k+tx-W/2)<6 && Math.abs(q[1]*k+ty-H/2)<6;
    if(centred){ stopLoc(); locSay(''); locNote=''; syncModeUI(); render(); }
    else centreOnMe();
    return;
  }
  if(locOn){ centreNext=true; return; }
  if(!navigator.geolocation){ locFailed('This browser can’t share a location.'); return; }
  if(geoBlocked()){ locFailed(EMBEDDED_MSG); return; }
  locOn=true;
  locbtn.setAttribute('aria-pressed','true');
  locbtn.setAttribute('data-state','wait');
  locNote=''; locSay('Finding you…'); syncModeUI();
  /* watchPosition, not getCurrentPosition: the point is to keep up as they walk.
     The first fix can be slow and coarse, so no maximumAge -- a cached fix from
     across town is worse than waiting.

     Wrapped: where the page is embedded in a cross-origin iframe that wasn't
     granted the geolocation permission -- which is how a Claude Artifact renders
     -- this can throw synchronously instead of calling the error callback. An
     uncaught throw killed the handler and the button simply did nothing. */
  try{
    locWatch=navigator.geolocation.watchPosition(onPos, onLocErr,
      { enableHighAccuracy:true, timeout:20000, maximumAge:0 });
  }catch(e){
    locFailed(EMBEDDED_MSG);
    return;
  }
  /* watchPosition can also simply never call back when it is blocked, so don't
     leave the reader staring at "Finding you…" forever. */
  clearTimeout(locTimer);
  locTimer=setTimeout(function(){
    if(locOn && !mePos) locFailed('Still no location fix. Check location is on for this browser, then try again.');
  }, 22000);
};

/* ---------------- list mode ---------------- */
var mnear=document.getElementById('mnear'), mloop=document.getElementById('mloop');
function syncModeUI(){
  var near = (listMode==='near');
  mnear.setAttribute('aria-pressed', near?'true':'false');
  mloop.setAttribute('aria-pressed', near?'false':'true');
  /* The hint only earns its space when something is wrong. "Nearest first" said
     nothing the button labelled "Closest to me" doesn't already say, and it cost
     a line above the map on a phone. locNote still shows in either mode: a
     failure drops the list back to loop order, so keying the message off being
     in "near" mode left the reader silently switched back with no explanation. */
  var hint=document.getElementById('lhint');
  var waiting = near && !mePos && locOn;
  var msg = locNote || (waiting ? 'Finding your location\u2026' : '');
  hint.classList.toggle('warn', !!locNote);
  hint.textContent = msg;
  hint.hidden = !msg;
}
function setMode(mo){
  listMode=mo;
  renderedAt=null;
  syncModeUI(); render(); scrollListToTop();
  /* closest-first is meaningless without a position, so asking for the mode is
     also asking for location -- rather than a dead button and no explanation */
  if(mo==='near' && !mePos && !locOn) locbtn.click();
}
mnear.onclick=function(){ setMode('near'); };
mloop.onclick=function(){ setMode('loop'); };

/* ---------------- popup ---------------- */
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
/* arrow-out-of-box, the standard "this leaves the page" glyph -- it hands off
   to Google Maps for turn-by-turn, which a bare "Directions" label never said */
function goLink(s){
  return '<a class="golink" target="_blank" rel="noopener" title="Open in Google Maps" '+
    'aria-label="Open '+esc(s.addr)+' in Google Maps (opens a new tab)" '+
    'href="https://www.google.com/maps/search/?api=1&query='+s.lat+'%2C'+s.lon+'">'+
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" '+
    'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+
    '<path d="M14 4h6v6"/><path d="M20 4l-8.5 8.5"/>'+
    '<path d="M19 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V6a1 1 0 011-1h5"/></svg></a>';
}
function nowHTML(s){
  var h='<div class="nowhd"><span class="nownum">'+num(s)+'</span>'+
    '<div style="min-width:0"><div class="nowad">'+esc(s.addr)+'</div>'+
    (legFromMe && activeLeg===s.i
      ? '<div class="nowwalk">'+distLabel(legDist)+' walk from you</div>' : '')+
    (s.venue?'<div class="nowvn">'+esc(s.venue)+'</div>':'')+'</div>'+
    goLink(s)+
    '<button class="nowx" type="button" aria-label="Clear selection">&times;</button></div>';
  s.sellers.forEach(function(x){
    /* the seller's payment string verbatim -- entries like "Cash (preferred)...
       $3.00 processing fee applies to cards" deserve reading in full */
    h+='<p class="nowit">'+esc(x.items)+
       '<br><span class="tg nowpay '+(x.cashOnly?'cash':'')+'">'+esc(x.pay)+'</span></p>';
  });
  /* The answer to "I'm here, where next?". Tapping it walks the reader along
     the loop one leg at a time, and the map draws that single leg. */
  var nx=STOPS[(s.i+1)%N];
  h+='<button class="nextbtn" type="button" data-next="'+nx.i+'">'+
     '<span class="nlab">Next stop</span>'+
     '<span class="nnum">'+num(nx)+'</span>'+
     '<span class="nad">'+esc(nx.addr)+'</span>'+
     '<span class="ndist">'+(mePos ? distLabel(routeMetresFromMe(nx.i)||0)
                                   : legLabel(s.i))+'</span></button>';
  return h;
}
/* The only overlay left on the map is the cluster picker, which is small and
   user-invoked, so a plain above-the-badge placement with a flip is enough.
   (The sale card used to live here too and needed a scoring routine to stay off
   the bold leg; it is in the list column now and the whole problem is gone.) */
function placePopAt(sx,sy){
  pop.hidden=false;
  var pw=pop.offsetWidth, ph=pop.offsetHeight;
  var L=sx-pw/2, T=sy-ph-30;
  if(T<8) T=sy+16;
  L=Math.max(8, Math.min(W-pw-8, L));
  T=Math.max(8, Math.min(H-ph-8, T));
  pop.style.left=L.toFixed(0)+'px'; pop.style.top=T.toFixed(0)+'px';
}
/* a cluster of genuinely next-door houses can be closer together in real
   distance than any zoom level can separate into individually tappable pins
   (MAXK is a hard cap). Rather than a dead end, list them by address so the
   reader picks directly instead of pinching at pixels. */
var pickerAt=null;
function pickerHTML(members){
  var h='<button class="x" type="button" aria-label="Close">&times;</button>'+
    '<div class="hd"><div class="ad">'+members.length+' sales here</div></div>'+
    '<div class="picklist">';
  members.slice().sort(function(a,b){ return num(STOPS[a])-num(STOPS[b]); }).forEach(function(i){
    var s=STOPS[i];
    h+='<button class="pick" type="button" data-i="'+i+'">'+
       '<span class="pnum">'+num(s)+'</span><span class="pad">'+esc(s.addr)+'</span></button>';
  });
  h+='</div>';
  return h;
}
function openPicker(members, cx, cy){
  sel=null;   /* a picker isn't "for" any one stop yet */
  pickerAt=[cx,cy];   /* layer-local, so apply() can keep it anchored through pan/zoom */
  pop.innerHTML=pickerHTML(members);
  placePopAt(cx*k+tx, cy*k+ty);
}
pop.addEventListener('click', function(e){
  if(e.target.closest('.x')){ select(null); return; }
  var pk=e.target.closest('.pick');
  if(pk){ var i=+pk.dataset.i; select(i, true); showLeg(i); }
});
nowEl.addEventListener('click', function(e){
  if(e.target.closest('.golink')) return;   /* let the Google Maps link through */
  if(e.target.closest('.nowx')){ select(null); return; }
  var nb=e.target.closest('.nextbtn');
  if(nb){ var ni=+nb.dataset.next; select(ni, true); showLeg(ni); }
});

/* ---------------- selection ---------------- */
function select(i, fromMap){
  var changed = (sel!==i);
  sel=i;
  pickerAt=null;   /* any selection change closes an open picker */
  /* the bold leg follows the selection, but does NOT move the map here --
     callers that need the leg framed call showLeg() instead */
  activeLeg = i;
  buildLeg(activeLeg);
  drawLeg();
  updateClusters();   /* the selected stop is always shown standalone, never clustered */
  pop.hidden=true;   /* the picker, if one was open */
  if(i===null) nowEl.hidden=true;
  else { nowEl.innerHTML=nowHTML(STOPS[i]); nowEl.hidden=false; }
  /* Which card the list leaves out depends on the selection, so the list has to
     be rebuilt when the selection moves -- otherwise the sale sat in the panel
     AND in the list directly beneath it, which is what Jim saw on his phone. */
  if(changed) render();
  pins.forEach(function(p,j){ p.classList.toggle('on', j===i); });
  cards.forEach(function(c){ if(c) c.classList.toggle('on', +c.dataset.i===i); });
  if(i===null) return;
  var card=cards.find(function(c){ return c && +c.dataset.i===i; });
  if(card && fromMap){
    var lr=listEl.getBoundingClientRect(), cr=card.getBoundingClientRect();
    if(cr.top<lr.top+4 || cr.bottom>lr.bottom-4)
      listEl.scrollTop += (cr.top-lr.top) - lr.height/2 + cr.height/2;
  }
  /* On a phone the page itself scrolls and the panel sits below the sticky map,
     so a selection made while scrolled down the list would land off-screen.
     Only when the selection actually MOVED: render() re-applies the current
     selection at the end, and in closest-first mode every GPS fix re-renders, so
     scrolling here unconditionally dragged the reader back down to the panel
     about once a second -- they could never reach the search or filters above
     the map (Jim, 2026-09-18). */
  if(changed && getComputedStyle(listEl).overflowY!=='auto') revealPanel();
}
/* Put the panel just below the sticky map. Measured, and instant rather than
   smooth -- see scrollListToTop() for why smooth scrolling isn't trusted here. */
function revealPanel(){
  var mapcol=document.getElementById('mapcol');
  var stuckH=mapcol ? mapcol.getBoundingClientRect().height : 0;
  var delta=nowEl.getBoundingClientRect().top - stuckH;
  if(delta<-2 || delta>2) window.scrollTo(0, Math.max(0, window.scrollY + delta));
}
/* metres actually walked on leg i, summed along the routed path */
var legM=[];
function legMetres(i){
  if(legM[i]==null){
    var t=0, L=WALK[i];
    for(var j=0;j<L.length-1;j++) t+=metres(L[j][0],L[j][1],L[j+1][0],L[j+1][1]);
    legM[i]=t;
  }
  return legM[i];
}
function distLabel(d){
  return d<300 ? Math.round(d*3.28084)+' ft' : (d/1609.344).toFixed(1)+' mi';
}
function legLabel(i){ return distLabel(legMetres(i)); }
/* Walking distance from the reader to a sale, over the same street graph the
   bold path is drawn on -- so the number on the button and the line on the map
   are describing the same walk. */
function routeMetresFromMe(i){
  if(!mePos) return null;
  var path=gPath(nearestNode(mePos[0],mePos[1]), GRAPH.s[i]);
  if(!path) return null;
  var pts=[[mePos[0],mePos[1]]];
  path.forEach(function(n){ pts.push(GN[n]); });
  pts.push([STOPS[i].lat, STOPS[i].lon]);
  var d=0;
  for(var j=0;j<pts.length-1;j++) d+=metres(pts[j][0],pts[j][1],pts[j+1][0],pts[j+1][1]);
  return d;
}

/* Frame one leg: both ends on screen with room to breathe, so "where do I go
   next" is answered without the reader hunting for the other end of the line. */
function fitLeg(instant){
  if(!legPts) return;
  var pts=legPts.map(function(p){ return px(p[0],p[1]); });
  var xs=pts.map(function(q){return q[0];}), ys=pts.map(function(q){return q[1];});
  var cx=(Math.max.apply(null,xs)+Math.min.apply(null,xs))/2;
  var cy=(Math.max.apply(null,ys)+Math.min.apply(null,ys))/2;
  /* Never frame tighter than MINSPAN_M of real ground. Legs between next-door
     houses are ~20 m long, and fitting one exactly slammed the map to maximum
     zoom showing two pins and no streets -- the reader loses every landmark
     they were using to orient. */
  var MINSPAN_M=190, perM=base/111320;
  var w=Math.max(Math.max.apply(null,xs)-Math.min.apply(null,xs), MINSPAN_M*perM);
  var h=Math.max(Math.max.apply(null,ys)-Math.min.apply(null,ys), MINSPAN_M*perM);
  /* A plain centred fit, now that the sale card has moved off the map. It used
     to need a reserved band and a scoring routine to keep the card off the line
     it was describing; the card lives in the list column and that whole problem
     is gone. */
  var GAP=26;
  var kx2=(W-GAP*2)/Math.max(w,1), ky2=(H-GAP*2)/Math.max(h,1);
  var k1=Math.max(MINK, Math.min(6, Math.min(kx2,ky2)));
  var tx1=W/2-cx*k1, ty1=H/2-cy*k1;
  /* instant on resize: the box changed under us and easing a correction there
     looks like a glitch rather than a move */
  if(instant){ k=k1; tx=tx1; ty=ty1; clamp(); apply(); }
  else animateTo(k1, tx1, ty1);
}

/* ---------------- filters + list ---------------- */
var ALLTAGS=[]; (function(){
  var c={}; STOPS.forEach(function(s){ s.tags.forEach(function(t){ c[t]=(c[t]||0)+1; }); });
  ALLTAGS=Object.keys(c).sort(function(a,b){ return c[b]-c[a] || a.localeCompare(b); })
    .map(function(t){ return {t:t,c:c[t]}; });
})();
var active={}, qstr='', payMode=null;   /* null | 'more' | 'cash' */
var chipsEl=document.getElementById('chips');
ALLTAGS.forEach(function(o){
  var b=document.createElement('button');
  b.type='button'; b.className='chip'; b.setAttribute('aria-pressed','false');
  b.innerHTML=esc(o.t)+' <span class="k">'+o.c+'</span>';
  b.onclick=function(){
    active[o.t]=!active[o.t];
    b.setAttribute('aria-pressed', active[o.t]?'true':'false');
    render();
  };
  chipsEl.appendChild(b);
});
var payMore=document.getElementById('paymore'), payCash=document.getElementById('paycash');
document.getElementById('kmore').textContent = STOPS.filter(function(s){return s.beyond;}).length;
document.getElementById('kcash').textContent = STOPS.filter(function(s){return s.cashOnly;}).length;
function syncPay(){
  payMore.setAttribute('aria-pressed', payMode==='more'?'true':'false');
  payCash.setAttribute('aria-pressed', payMode==='cash'?'true':'false');
}
payMore.onclick=function(){ payMode = payMode==='more'?null:'more'; syncPay(); render(); };
payCash.onclick=function(){ payMode = payMode==='cash'?null:'cash'; syncPay(); render(); };

var qEl=document.getElementById('q'), qclr=document.getElementById('qclr');
qEl.addEventListener('input', function(){ qstr=qEl.value.trim().toLowerCase();
  qclr.hidden=!qstr; render(); });
qclr.onclick=function(){ qEl.value=''; qstr=''; qclr.hidden=true; qEl.focus(); render(); };
document.getElementById('reset').onclick=function(){
  active={}; payMode=null; qstr=''; qEl.value=''; qclr.hidden=true;
  Array.prototype.forEach.call(chipsEl.children,function(b){ b.setAttribute('aria-pressed','false'); });
  syncPay(); render(); select(null);
};

function match(s){
  var on=Object.keys(active).filter(function(t){ return active[t]; });
  if(on.length && !on.every(function(t){ return s.tags.indexOf(t)>=0; })) return false;
  if(payMode==='more' && !s.beyond) return false;
  if(payMode==='cash' && !s.cashOnly) return false;
  if(qstr){
    var hay=(s.addr+' '+s.venue+' '+s.tags.join(' ')+' '+
      s.sellers.map(function(x){return x.items+' '+x.pay;}).join(' ')).toLowerCase();
    if(hay.indexOf(qstr)<0) return false;
  }
  return true;
}
var rendering=false;
function render(){
  /* render() re-applies the selection at the end and select() rebuilds the list
     when the selection moves, so the two call each other. One pass is enough. */
  if(rendering) return;
  rendering=true;
  try{ renderBody(); } finally { rendering=false; }
}
function renderBody(){
  var shown=ordered().filter(match);
  var on=Object.keys(active).filter(function(t){ return active[t]; });
  var dirty = on.length || payMode || qstr;
  document.getElementById('reset').hidden = !dirty;
  document.getElementById('tally').innerHTML = dirty
    ? '<b>'+shown.length+'</b> of '+N+' sales shown'
    : N+' sales on '+new Set(STOPS.map(function(s){return s.street;})).size+' streets';

  var keep={}; shown.forEach(function(s){ keep[s.i]=1; });
  pins.forEach(function(p,i){ p.classList.toggle('dim', !keep[i]); });

  /* #nowpanel shows the selected sale in full, directly above the list, so its
     card underneath was the same address and the same description twice --
     pinned to the top of the phone screen where the duplication was hardest to
     miss. Filtered out of the list, not out of `keep`, so its pin stays lit. */
  var matched = shown.length;
  shown = shown.filter(function(s){ return s.i!==sel; });

  listEl.innerHTML=''; cards=[];
  if(!matched){
    listEl.innerHTML='<div class="empty"><b>Nothing matches</b>'+
      'Try fewer filters, or clear the search.</div>';
    return;
  }
  /* everything that matched is already shown in the panel above */
  if(!shown.length){ syncNear(); return; }
  /* Street headings group a list that runs street by street. In closest-first
     order the list hops between streets by design, so a heading per card would
     be noise -- each card carries its distance instead. */
  var grouped = (listMode!=='near' || !mePos);
  var street=null;
  shown.forEach(function(s){
    if(grouped && s.street!==street){
      street=s.street;
      var h=document.createElement('div'); h.className='stgroup';
      h.textContent=street.replace(/ Avenue$/,' Ave').replace(/ Street$/,' St');
      listEl.appendChild(h);
    }
    var c=document.createElement('article');
    c.className='card'; c.dataset.i=s.i; c.tabIndex=0;
    c.setAttribute('role','button');
    var items=s.sellers.map(function(x){return x.items;}).join('  \u2022  ');
    c.innerHTML='<div class="cnum">'+num(s)+'</div><div style="min-width:0">'+
      '<div class="cad">'+esc(s.addr)+'</div>'+
      (grouped ? '' : '<div class="cdist">'+
         distLabel(metres(mePos[0],mePos[1],s.lat,s.lon))+' away</div>')+
      (s.venue?'<div class="cvn">'+esc(s.venue)+'</div>':'')+
      (s.sellers.length>1?'<div class="cvn" style="color:var(--gold)">'+
         s.sellers.length+' households at this address</div>':'')+
      '<div class="cit">'+esc(items)+'</div>'+
      (s.cashOnly?'<div class="ctags"><span class="tg cash">Cash only</span></div>':'')+
      '</div>'+goLink(s);
    function go(){ select(s.i); showLeg(s.i); }
    c.addEventListener('click', function(e){ if(e.target.closest('a')) return; go(); });
    c.addEventListener('keydown', function(e){
      if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } });
    listEl.appendChild(c); cards.push(c);
  });
  syncNear();   /* the cards were just rebuilt, so re-apply the nearest-stop mark */
  if(sel!==null && !keep[sel]) select(null);
  else if(sel!==null) select(sel);
}

/* ---------------- boot ---------------- */

/* Saturday 26 September 2026, 8am-noon CDT (UTC-5) */
var SALE_START = Date.parse('2026-09-26T08:00:00-05:00');
var SALE_END   = Date.parse('2026-09-26T12:00:00-05:00');
(function(){
  var pill = document.getElementById('livepill');
  function tick(){
    var now = Date.now();
    if(now >= SALE_START && now < SALE_END){
      pill.hidden = false; pill.className = 'live on'; pill.textContent = 'Happening now';
    } else if(now >= SALE_END){
      pill.hidden = false; pill.className = 'live done'; pill.textContent = 'Ended';
    } else {
      pill.hidden = true;
    }
  }
  tick(); setInterval(tick, 60000);
})();

function relayout(){
  measure(); drawMap(); placePins(); apply();
}
buildPins();
document.getElementById('footnote').innerHTML=footnoteHTML();
syncModeUI(); relayout(); render();
/* Location on by default. Deliberate: this page exists to be used while walking
   around the neighbourhood, and the first thing it should answer is "what's near
   me". Safari shows its own permission prompt, and everything degrades to the
   walking loop if the reader says no. */
locbtn.click();
window.addEventListener('resize', function(){
  relayout(); render();
  /* measure() recomputes the projection scale, but tx/ty/k are still in the old
     one, so the view slides off whatever the reader was looking at -- most
     visible on a phone rotating or the browser chrome collapsing. Re-frame the
     leg they were sent to, or fall back to fitting everything. */
  if(activeLeg!==null) fitLeg(true); else fit();
});
document.addEventListener('keydown', function(e){ if(e.key==='Escape') select(null); });
})();
</script>
